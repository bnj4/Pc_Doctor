<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Doctor - Diagnóstico & Cotización</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 { color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { color: var(--text-sub); margin-bottom: 25px; }

        .btn-option {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-option:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #475569; }
        .btn-secondary:hover { background-color: #334155; }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #059669; }

        .card {
            background: #0f172a;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            text-align: left;
        }

        .hidden { display: none; }

        /* Modal styling */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💻 PC Doctor</h1>
    <p class="subtitle">Diagnóstico Técnico y Cotización de Reparación</p>

    <!-- Vista 1: Selección de Síntoma -->
    <div id="step-sintomas">
        <h3>Selecciona el síntoma principal de tu equipo:</h3>
        <div id="lista-sintomas">Cargando síntomas...</div>
    </div>

    <!-- Vista 2: Pregunta del Árbol -->
    <div id="step-preguntas" class="hidden">
        <h3 id="texto-pregunta">Cargando pregunta...</h3>
        <button class="btn-option" onclick="responder(true)">Sí, confirmo este comportamiento</button>
        <button class="btn-option btn-secondary" onclick="responder(false)">No / No se presenta</button>
    </div>

    <!-- Vista 3: Resultado de Diagnóstico y Cotización -->
    <div id="step-diagnostico" class="hidden">
        <h2 style="color: #4ade80;">Diagnóstico Final</h2>
        <div class="card">
            <h3 id="diag-titulo" style="color: #38bdf8;"></h3>
            <p><strong>Causa Probable:</strong> <span id="diag-causa"></span></p>
            <p><strong>Solución Recomendada:</strong> <span id="diag-solucion"></span></p>
            <hr style="border-color: #334155;">
            <p style="font-size: 18px;"><strong>Presupuesto Estimado:</strong> <span id="diag-precio" style="color: #4ade80; font-weight: bold;"></span> CLP</p>
        </div>
        <button class="btn-option btn-success" onclick="abrirModalContacto()">Agendar Visita / Solicitar Reparación</button>
        <button class="btn-option btn-secondary" onclick="reiniciar()">Realizar otro diagnóstico</button>
    </div>
</div>

<!-- Modal para solicitar reparación y agendar visita -->
<div id="modal-contacto" class="modal hidden">
    <div class="modal-content">
        <h3 style="color: #38bdf8; margin-top:0;">Agendar Servicio Técnico</h3>
        <label>RUT / Credencial:</label>
        <input type="text" id="cliente-rut" placeholder="Ej: 12345678-9">

        <label>Nombre Completo:</label>
        <input type="text" id="cliente-nombre" placeholder="Ej: Juan Pérez">

        <label>Correo Electrónico:</label>
        <input type="email" id="cliente-correo" placeholder="ejemplo@correo.com">

        <label>Teléfono de Contacto:</label>
        <input type="text" id="cliente-telefono" placeholder="+56912345678">

        <label>Fecha Estimada de Visita:</label>
        <input type="date" id="fecha-visita">

        <button class="btn-option btn-success" onclick="guardarSolicitud()">Confirmar Agendamiento y Ver Comprobante</button>
        <button class="btn-option btn-secondary" onclick="cerrarModalContacto()">Cancelar</button>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080/api";
    let preguntaActual = null;
    let diagnosticoActual = null;

    // Cargar Lista de Síntomas al Iniciar
    window.onload = function() {
        fetch(`${API_URL}/sintomas`)
            .then(res => res.json())
            .then(data => {
                let html = "";
                data.forEach(s => {
                    html += `<button class="btn-option" onclick="iniciarDiagnostico(${s.idSintoma})">${s.nombre}</button>`;
                });
                document.getElementById("lista-sintomas").innerHTML = html;
            })
            .catch(err => alert("Error conectando con la API backend. Asegúrate de levantar Spring Boot."));
    };

    // Iniciar el flujo de preguntas
    function iniciarDiagnostico(idSintoma) {
        fetch(`${API_URL}/preguntas/sintoma/${idSintoma}`)
            .then(res => res.json())
            .then(preguntas => {
                if (preguntas.length > 0) {
                    mostrarPregunta(preguntas[0]);
                    document.getElementById("step-sintomas").classList.add("hidden");
                    document.getElementById("step-preguntas").classList.remove("hidden");
                }
            });
    }

    function mostrarPregunta(pregunta) {
        preguntaActual = pregunta;
        document.getElementById("texto-pregunta").innerText = pregunta.textoPregunta;
    }

    // Navegación en el árbol de preguntas según Sí / No
    function responder(esAfirmativo) {
        let siguientePreguntaId = esAfirmativo ? preguntaActual.idSiguienteSi : preguntaActual.idSiguienteNo;
        let diagnosticoId = esAfirmativo ? preguntaActual.idDiagnosticoSi : preguntaActual.idDiagnosticoNo;

        if (siguientePreguntaId) {
            fetch(`${API_URL}/preguntas/${siguientePreguntaId}`)
                .then(res => res.json())
                .then(data => mostrarPregunta(data));
        } else if (diagnosticoId) {
            mostrarDiagnostico(diagnosticoId);
        } else {
            alert("Atención: No hay más preguntas ni diagnóstico mapeado.");
        }
    }

    // Mostrar el resultado final y presupuesto
    function mostrarDiagnostico(id) {
        fetch(`${API_URL}/diagnosticos/${id}`)
            .then(res => res.json())
            .then(d => {
                diagnosticoActual = d;
                document.getElementById("diag-titulo").innerText = d.titulo;
                document.getElementById("diag-causa").innerText = d.causaProbable;
                document.getElementById("diag-solucion").innerText = d.solucionRecomendada;
                document.getElementById("diag-precio").innerText = `$${d.precioEstimado}`;

                document.getElementById("step-preguntas").classList.add("hidden");
                document.getElementById("step-diagnostico").classList.remove("hidden");
            });
    }

    // Lógica del Modal
    function abrirModalContacto() {
        document.getElementById("modal-contacto").classList.remove("hidden");
    }

    function cerrarModalContacto() {
        document.getElementById("modal-contacto").classList.add("hidden");
    }

    // Guardar cliente y agendamiento
    function guardarSolicitud() {
        const rut = document.getElementById("cliente-rut").value;
        const nombre = document.getElementById("cliente-nombre").value;
        const correo = document.getElementById("cliente-correo").value;
        const telefono = document.getElementById("cliente-telefono").value;
        const fecha = document.getElementById("fecha-visita").value;

        if (!rut || !nombre || !correo || !telefono || !fecha) {
            alert("Por favor complete todos los campos de contacto.");
            return;
        }

        // 1. Registrar o recuperar cliente
        fetch(`${API_URL}/clientes`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                credencialRut: rut,
                nombreCompleto: nombre,
                correo: correo,
                telefono: telefono
            })
        })
        .then(res => res.json())
        .then(cliente => {
            // 2. Crear solicitud de agendamiento
            return fetch(`${API_URL}/solicitudes`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    idCliente: cliente.idCliente,
                    idDiagnostico: diagnosticoActual.idDiagnostico,
                    fechaVisita: fecha
                })
            });
        })
        .then(res => res.json())
        .then(solicitud => {
            alert("¡Agendamiento realizado con éxito!");
            cerrarModalContacto();
            // Generar vista para imprimir presupuesto
            window.print();
        })
        .catch(err => alert("Error al guardar la solicitud. Verifique los datos ingresados."));
    }

    function reiniciar() {
        location.reload();
    }
</script>
</body>
</html>
