spring.datasource.url=jdbc:mysql://localhost:3306/pc_doctor_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Muestra los errores completos en la respuesta JSON de Thunder Client
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Muestra las consultas SQL e impresiones de Spring Web en la terminal
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG